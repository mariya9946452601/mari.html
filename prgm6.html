<html>
<head>
<title>String and Math</title>
</head>
<body bgcolor="lightgreen">
<h2>STRING FUNCTIONS</h2>
<script>
let str = "Hello World";
document.write("String: " + str + "<br>");
document.write("Length: " + str.length + "<br>");
document.write("Uppercase: " + str.toUpperCase() + "<br>");
document.write("Lowercase: " + str.toLowerCase() + "<br>");
document.write("Character: " + str.charAt(0) + "<br>");
document.write("<h2>MATH FUNCTIONS</h2>");
document.write("Square root: " + Math.sqrt(25) + "<br>");
document.write("Power: " + Math.pow(2,3) + "<br>");
document.write("Round: " + Math.round(4.6) + "<br>");
document.write("Maximum: " + Math.max(10,20,30) + "<br>");
document.write("Minimum: " + Math.min(10,20,30) + "<br>");
</script>
</body>
</html>
